<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Вход · ИТАЛКОФЕ admin</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="admin-page admin-login-wrap">
  <form class="admin-login-card" method="post">
    <h1>ИТАЛКОФЕ · admin</h1>
    {% if error %}<p class="admin-error">{{ error }}</p>{% endif %}
    <label>Пароль
      <input type="password" name="password" autofocus required>
    </label>
    <button type="submit" class="btn btn-accent btn-full">Войти</button>
  </form>
</div>
</body>
</html>
